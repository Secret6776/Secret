<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#1b2340;--mute:#5b6485;--line:#d9dff0;--acc:#2f4bd8;--err:#c0283f;--on:#fff}

input{background:var(--bg);color:var(--ink);margin-bottom:12px}
button{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#m{color:var(--err);min-height:1.5em;margin:10px 0 0;font-size:.9rem}
