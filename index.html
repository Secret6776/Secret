<style>
:root{--bg:#f6f8fc;--card:#fff;--ink:#1b2340;--mute:#5b6485;--line:#d9dff0;--acc:#2f4bd8;--err:#c0283f;--on:#fff}

#m{color:var(--err);min-height:1.5em;margin:10px 0 0;font-size:.9rem}
